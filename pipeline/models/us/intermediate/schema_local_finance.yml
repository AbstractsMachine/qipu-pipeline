version: 2

models:
  - name: int_us_lf_spending_lines
    description: "Every US local spending source in one shape, before category mapping (see core_us_lf_spending)."
    columns:
      - name: line_id
        tests: [unique, not_null]
  - name: int_us_lf_revenue_lines
    description: "Every US local revenue source in one shape, before category mapping (see core_us_lf_revenue)."
    columns:
      - name: line_id
        tests: [unique, not_null]
  - name: int_us_lf_government_match
    description: |
      State government keys ↔ Census IUF 2022 units by normalised name inside
      the state. Measured 2026-09-22: MA 100 %, FL 99.8 %, IA 99.0 %, IN 98.4 %
      unique; the rest (19 small towns) stay unmatched rather than guessed.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [state, source_group, government_key]
    columns:
      - name: match_status
        tests:
          - accepted_values:
              values: ['unique', 'ambiguous', 'unmatched']
