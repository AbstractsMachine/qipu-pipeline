version: 2

models:
  - name: core_us_sf_budget
    description: >
      SF adopted budget OBT — row-level AAO lines FY2010-FY2027 with
      transfer/adjustment flags. Net totals include the negative Transfer
      Adjustment rows (kept per API-RECON §A.1). Rollups live in marts.
    columns:
      - name: fiscal_year
        tests: [not_null]
      - name: revenue_or_spending
        tests: [not_null]
      - name: budget_amt
        tests: [not_null]
      - name: is_transfer_adjustment
        tests: [not_null]

  - name: core_us_sf_actuals
    description: >
      SF actuals OBT — row-level spending/revenue FY1999-FY2027 with
      related-govt-unit and transfer flags (the budget-vs-actual
      reconciliation levers, measured in mart_us_sf_budget_vs_actual).
    columns:
      - name: fiscal_year
        tests: [not_null]
      - name: amount
        tests: [not_null]
      - name: is_related_govt_unit
        tests: [not_null]

  - name: core_us_sf_vouchers
    description: >
      SF vendor payments OBT — row-level voucher distribution lines
      FY2007-FY2027 (~8.07M rows). Vendor stays the unkeyed portal string;
      bucketing happens in mart_us_sf_top_payees via the manual seed.
    columns:
      - name: fiscal_year
        tests: [not_null]
      - name: vouchers_paid
        tests: [not_null]

  - name: core_us_sf_contracts
    description: >
      SF supplier contracts OBT — row-level contract × project-team-member
      rows (summing agreed_amt double-counts; grain tested in
      tests/us/assert_us_sf_contracts_grain.sql).
    columns:
      - name: agreed_amt
        tests: [not_null]
      - name: is_prime_contractor_row
        tests: [not_null]

  - name: core_us_sf_comp
    description: >
      SF employee compensation OBT — row-level comp records 2013-2025 with
      BOTH year_type accountings exposed (filtering is mart business; the
      Calendar/Fiscal split is tested in
      tests/us/assert_us_sf_comp_year_type_split.sql).
    columns:
      - name: year
        tests: [not_null]
      - name: year_type
        tests: [not_null]
      - name: total_compensation
        tests: [not_null]

  - name: core_us_sf_population
    description: >
      San Francisco resident population per estimate year (Census PEP
      Vintage 2025, July 1 estimates 2020-2025). Denominator for
      per-resident scaling; plausibility tested in
      tests/us/assert_us_sf_population_plausible.sql.
    columns:
      - name: year
        tests: [not_null, unique]
      - name: population
        tests: [not_null]
      - name: source_url
        tests: [not_null]

  - name: core_us_sf_source_catalog
    description: >
      DataSF provenance dimension — one row per synced Socrata dataset
      (source_id), collapsed from the dataset×column staging catalog.
      Marts join it to stamp dataset_page_url / dataset_name / attribution /
      rows_updated_at (the export contract's source_url and as_of). Carries
      no amounts.
    columns:
      - name: source_id
        tests: [not_null, unique]
      - name: dataset_page_url
        tests: [not_null]
      - name: rows_updated_at
        tests: [not_null]

  - name: core_us_sf_places
    description: >
      SF places — the reviewed place ↔ facility crosswalk joined to the City
      Facilities registry, one row per place_slug × facility_id: identity
      evidence from the crosswalk, address / APN / size / owner / coordinates
      read live from the registry, plus a GEOGRAPHY point. Every place mart
      starts here.
    columns:
      - name: place_slug
        tests: [not_null]
      - name: facility_id
        tests: [not_null]

  - name: core_us_sf_place_contracts
    description: >
      Place ↔ prime contract links (one row per place_slug × contract_no) as
      reviewed in seed_us_sf_place_contracts, with the contract's agreed and
      lifetime-paid dollars. Feeds place capital rows and the payee chain.

  - name: core_us_sf_place_bonds
    description: >
      Place ↔ GO-bond links (place_slug × source_kind × item_name) as
      reviewed in seed_us_sf_place_bonds: exact bond dollars for bond_item
      rows, program context for bond_project rows.

  - name: core_us_sf_dpw_projects
    description: >
      DPW projects OBT — one row per project × mapped point with a GEOGRAPHY,
      straight from stg_us_sf_dpw_projects. Used for the spatial "construction
      near this place" join. Carries no money.

  - name: core_us_sf_building_permits
    description: >
      Building permits OBT (~1.29M rows) from stg_us_sf_building_permits;
      block_lot is the APN that joins to core_us_sf_places. Costs are the
      applicant's declared value, not city spend.
