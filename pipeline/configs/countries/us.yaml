# =============================================================================
# United States — national + city sources configuration
#
# Read by:
#   - `pipeline/scripts/sync/sync_fiscaldata.py us`   (type: fiscaldata_api)
#   - `pipeline/scripts/sync/sync_census_popest.py us` (type: census_popest_csv)
#   - `pipeline/scripts/sync/sync_socrata.py us`      (type: socrata — DataSF;
#       `--block ca_sco` for the California State Controller's sources)
#   - `pipeline/scripts/sync/sync_us_local_finance.py us` (types: census_iuf,
#       iowa_datahub, indiana_gateway, ma_dls_logi, fl_edr_xlsx)
#
# Each source declares how to ingest one dataset into BigQuery `raw.us_*`
# (city-scale tables are `raw.us_sf_*`). Raw tables keep every value AS A
# STRING exactly as the API returns it (Fiscal Data returns everything as
# JSON strings with "null" for missing; Socrata numbers arrive as strings
# and text dates come in mixed formats — typing happens once, in stg. See
# docs/us/API-RECON.md §A.6 and §B.5).
#
# Decision references: ADR-0010 (D3 protocol adapters + country YAML),
# docs/us/API-RECON.md §A (DataSF) + §B (verified endpoints and recipes).
# =============================================================================

country_slug: us
country_name: United States

# BigQuery destination dataset for raw tables (same `raw` dataset as
# France/Paris; the `us_` table prefix is the country namespace).
bq_raw_dataset: raw

# ---------------------------------------------------------------------------
# Treasury Fiscal Data protocol settings (shared by all fiscaldata_api
# sources). The machine-readable catalog carries per-field labels/units and
# dataset page paths; sync_fiscaldata.py snapshots the entries for every
# source below into `raw.us_fiscaldata_catalog` on each run.
# ---------------------------------------------------------------------------
fiscaldata:
  api_base: "https://api.fiscaldata.treasury.gov/services/api/fiscal_service"
  catalog_url: "https://api.fiscaldata.treasury.gov/services/dtg/metadata/"
  dataset_page_base: "https://fiscaldata.treasury.gov/datasets"
  catalog_table: us_fiscaldata_catalog
  page_size: 10000

# ---------------------------------------------------------------------------
# DataSF / Socrata protocol settings (shared by all `socrata` sources below).
# Generic SODA mechanics verified live 2026-07-15/16 (docs/us/API-RECON.md
# §A.6 + sync_socrata.py header):
#   - paged JSON via $limit/$offset (always pass $order for stable paging;
#     `:id` is the stable system ordering)
#   - bulk CSV in large /resource/<id>.csv pages — the one-shot
#     /api/views/<id>/rows.csv export drops mid-stream on multi-GB pulls
#     (verified 2026-07-16) with no Range/resume, so pages retry instead
#   - JSON records OMIT keys whose value is null → the column list must come
#     from the views metadata, not from the first row
#   - numbers arrive as strings; raw keeps them byte-faithful (typing in stg)
# sync_socrata.py snapshots each dataset's /api/views/<id>.json metadata
# (name, rowsUpdatedAt, columns) into `raw.us_sf_catalog` on each run —
# the provenance source of truth for stg/marts/exports.
# ---------------------------------------------------------------------------
datasf:
  protocol: socrata
  domain: "data.sfgov.org"
  portal_name: "DataSF — City and County of San Francisco open data portal"
  dataset_page_base: "https://data.sfgov.org/d"
  catalog_table: us_sf_catalog
  page_size: 50000        # paged-json mode ($limit per request)
  csv_page_size: 500000   # bulk-csv mode (rows per CSV page; the one-shot
                          # rows.csv export drops mid-stream on long pulls)

# California State Controller — "By the Numbers", the Cities Annual Report
# (every city files with the SCO). Same SODA mechanics as DataSF; sources
# name this block with `block: ca_sco`. Tabular datasets, not the xlsx blob
# of the same report (verified 2026-09-22).
ca_sco:
  protocol: socrata
  domain: "bythenumbers.sco.ca.gov"
  portal_name: "California State Controller's Office — By the Numbers"
  dataset_page_base: "https://bythenumbers.sco.ca.gov/d"
  catalog_table: us_ca_sco_catalog
  page_size: 50000
  csv_page_size: 500000

sources:
  # ---------------------------------------------------------------------------
  # MTS Table 9 — receipts by source + outlays by function (daily-bread table)
  # 33 rows/month: section 1 = receipts (D|RSG detail, T|SL total at 1.8),
  # section 2 = outlays by function (D|F detail, T|SL total at 2.20).
  # Amounts in DOLLARS. Coverage verified 2015-03-31 → latest closed month.
  # ---------------------------------------------------------------------------
  - id: mts_table_9
    type: fiscaldata_api
    target_table: us_fiscaldata_mts_table_9
    endpoint: "v1/accounting/mts/mts_table_9"
    earliest_record_date: "2015-03-31"
    sort: "record_date,src_line_nbr"
    description: "MTS Table 9 — Summary of Receipts by Source, and Outlays by Function (dollars, monthly + FYTD + prior FYTD)"

  # ---------------------------------------------------------------------------
  # MTS Table 9A — outlays by function × subfunction. No data_type_cd column;
  # verified 2026-07-15: rows are clean detail (no embedded totals), the sum
  # of all rows per record_date equals the Table 9 outlays total to the penny.
  # ---------------------------------------------------------------------------
  - id: mts_table_9_outlays_functions_subfunctions
    type: fiscaldata_api
    target_table: us_fiscaldata_mts_table_9_outlays_functions_subfunctions
    endpoint: "v1/accounting/mts/mts_table_9_outlays_functions_subfunctions"
    earliest_record_date: "2015-03-31"
    sort: "record_date,src_line_nbr"
    description: "MTS Table 9A — Summary of Outlays by Function and Subfunction (dollars)"

  # ---------------------------------------------------------------------------
  # MTS Table 5 — outlays by agency/bureau/account. ~802 rows/month, 5-level
  # hierarchy. Agency totals = data_type_cd 'T' + record_type_cd 'C' (verified
  # 2026-07-15: always sequence_level_nbr 2, 29 rows/month, and
  # sum(T|C) + 'Total--Undistributed Offsetting Receipts' = 'Total Outlays'
  # SL row to the penny).
  # ---------------------------------------------------------------------------
  - id: mts_table_5
    type: fiscaldata_api
    target_table: us_fiscaldata_mts_table_5
    endpoint: "v1/accounting/mts/mts_table_5"
    earliest_record_date: "2015-03-31"
    sort: "record_date,src_line_nbr"
    description: "MTS Table 5 — Outlays of the U.S. Government by agency/bureau/account (dollars, gross/applicable receipts/net)"

  # ---------------------------------------------------------------------------
  # MTS long series — monthly Receipts / Outlays / Deficit-Surplus since
  # 1980-10-31, in MILLIONS of dollars. Sign convention in this dataset:
  # 'Deficit/Surplus (-)' = Outlays − Receipts (deficit POSITIVE) — flipped
  # vs MTS Tables 3/5. Normalized in core_us_monthly_totals.
  # ---------------------------------------------------------------------------
  - id: mts_receipts_outlays_deficit_surplus
    type: fiscaldata_api
    target_table: us_fiscaldata_mts_receipts_outlays_deficit_surplus
    endpoint: "v1/accounting/mts/mts_receipts_outlays_deficit_surplus"
    earliest_record_date: "1980-10-31"
    sort: "record_date,src_line_nbr"
    description: "MTS — Monthly Receipts, Outlays and Deficit/Surplus since FY1981 (MILLIONS of dollars, deficit positive)"

  # ---------------------------------------------------------------------------
  # Debt to the Penny — total public debt outstanding per business day
  # (public + intragovernmental + total), dollars, 1993-04-01 → daily.
  # ---------------------------------------------------------------------------
  - id: debt_to_penny
    type: fiscaldata_api
    target_table: us_fiscaldata_debt_to_penny
    endpoint: "v2/accounting/od/debt_to_penny"
    earliest_record_date: "1993-04-01"
    sort: "record_date,src_line_nbr"
    description: "Debt to the Penny — daily total public debt outstanding (dollars)"

  # ---------------------------------------------------------------------------
  # Historical Debt Outstanding — fiscal-year-end debt, annual 1790 → latest
  # closed fiscal year, dollars.
  # ---------------------------------------------------------------------------
  - id: debt_outstanding
    type: fiscaldata_api
    target_table: us_fiscaldata_debt_outstanding
    endpoint: "v2/accounting/od/debt_outstanding"
    earliest_record_date: "1790-01-01"
    sort: "record_date,src_line_nbr"
    description: "Historical Debt Outstanding — fiscal-year-end total public debt since 1790 (dollars)"

  # ---------------------------------------------------------------------------
  # Census population — US national resident population (per-resident scaling).
  # The api.census.gov API now REQUIRES a key (verified live 2026-07-15:
  # HTTP 302 → missing_key.html, header X-DataWebAPI-KeyError). The Vintage
  # 2025 estimates CSV on www2.census.gov is no-auth and machine-readable —
  # synced instead (raw → stg → core, same layering).
  # NOTE: www2.census.gov can hang on IPv6 — sync_census_popest.py forces IPv4.
  # ---------------------------------------------------------------------------
  - id: census_population
    type: census_popest_csv
    target_table: us_census_population
    url: "https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/state/totals/NST-EST2025-ALLDATA.csv"
    source: "U.S. Census Bureau, Population Estimates Program (PEP), Vintage 2025"
    source_page: "https://www.census.gov/programs-surveys/popest.html"
    description: "Census Bureau Vintage 2025 resident population estimates (national + states), July 1 estimates 2020-2025"

  # ---------------------------------------------------------------------------
  # Census population — incorporated places (city-level, for /us/city/* per-
  # resident scaling). Same no-auth www2.census.gov Vintage 2025 path as the
  # national file, cities/totals variant (verified live 2026-07-16: HTTP 200,
  # text/csv, 7.4 MB). San Francisco city = SUMLEV '162', STATE '06',
  # PLACE '67000' (filtered in stg_us_sf_population, whole file kept in raw).
  # Same IPv4-forcing caveat as the national file.
  # ---------------------------------------------------------------------------
  - id: census_population_places
    type: census_popest_csv
    target_table: us_census_population_places
    url: "https://www2.census.gov/programs-surveys/popest/datasets/2020-2025/cities/totals/sub-est2025.csv"
    source: "U.S. Census Bureau, Population Estimates Program (PEP), Vintage 2025 — Subcounty Resident Population Estimates"
    source_page: "https://www.census.gov/programs-surveys/popest.html"
    description: "Census Bureau Vintage 2025 resident population estimates (incorporated places and minor civil divisions), July 1 estimates 2020-2025"

  # ===========================================================================
  # DataSF — /us/city/sf modern spine (docs/us/API-RECON.md §A)
  # All published by the SF Controller's Office, refreshed weekly (comp
  # bi-annually). All-STRING raw tables `raw.us_sf_*` + `_synced_at`.
  # ===========================================================================

  # ---------------------------------------------------------------------------
  # Budget — adopted AAO only (no budget-phase field anywhere on the portal).
  # Grain: FY × revenue_or_spending × org/dept/program × character/object/
  # sub_object × fund hierarchy. FY2010–FY2027 (SF budgets two years at a
  # time — year-2 figures are high-level estimates; label partial years).
  # Net total DEPENDS on embedded negative "Transfer Adjustments (Citywide)"
  # rows — keep them. `related_govt_unit` is broken here (mirrors
  # revenue_or_spending) — the real flag lives on the actuals dataset.
  # ---------------------------------------------------------------------------
  - id: sf_budget
    type: socrata
    target_table: us_sf_budget
    dataset_id: "xdgd-c79v"
    mode: paged-json
    order_by: ":id"
    description: "SF Budget (adopted AAO) — FY2010-FY2027, ~390k rows, weekly"

  # ---------------------------------------------------------------------------
  # Spending and Revenue (actuals) — FY1999–FY2027, gross where budget is net
  # (related govt units + Transfers Out + Intrafund Transfers Out; see
  # analysis_us_sf_budget_vs_actual_reconciliation). Casing bug verified:
  # related_govt_units ∈ {No, NO, Yes, YES} — normalized in stg.
  # Chart-of-accounts break at FY2018 (legacy numeric codes → PeopleSoft
  # mnemonics).
  # ---------------------------------------------------------------------------
  - id: sf_spending_revenue
    type: socrata
    target_table: us_sf_spending_revenue
    dataset_id: "bpnb-jwfb"
    mode: paged-json
    order_by: ":id"
    description: "SF Spending and Revenue (actuals) — FY1999-FY2027, ~763k rows, weekly"

  # ---------------------------------------------------------------------------
  # Vendor Payments (Vouchers) — the "qui reçoit" dataset. 8.07M rows →
  # synced via bulk CSV pages (buffered to one local .csv.gz, single BQ
  # load job — NEVER paged as 8M JSON rows). Grain: voucher × accounting
  # distribution line. Vendor names are UNKEYED STRINGS (BNY Mellon under
  # 2 spellings); naive top-payee ranking is dominated by banks/fiscal
  # agents → bucketed via seed_us_sf_payee_buckets.
  # ---------------------------------------------------------------------------
  - id: sf_vouchers
    type: socrata
    target_table: us_sf_vouchers
    dataset_id: "n9pm-xkyq"
    mode: bulk-csv
    order_by: ":id"
    description: "SF Vendor Payments (vouchers) — FY2007-FY2027, ~8.07M rows, weekly (bulk CSV)"

  # ---------------------------------------------------------------------------
  # Supplier Contracts — grain = contract × project-team member: summing
  # agreed_amt double-counts (48,350 rows vs ~31,935 distinct contract_no —
  # encoded as a dbt test). Placeholder 2200-12-31 end dates capped in stg.
  # ---------------------------------------------------------------------------
  - id: sf_supplier_contracts
    type: socrata
    target_table: us_sf_supplier_contracts
    dataset_id: "cqi5-hm2d"
    mode: paged-json
    order_by: ":id"
    description: "SF Supplier Contracts — ~48k rows (contract × team member), weekly"

  # ---------------------------------------------------------------------------
  # Employee Compensation — pseudonymous employee × year × year_type × job ×
  # dept, 2013-2025, bi-annual. #1 trap: year_type contains BOTH Calendar
  # AND Fiscal — always filter one or everything double-counts (kept in core
  # with the field exposed; marts filter year_type='Fiscal').
  # ---------------------------------------------------------------------------
  - id: sf_employee_comp
    type: socrata
    target_table: us_sf_employee_comp
    dataset_id: "88g8-5mnd"
    mode: bulk-csv
    description: "SF Employee Compensation — 2013-2025, ~1.1M rows (Calendar + Fiscal), bi-annual (bulk CSV)"

  # ---------------------------------------------------------------------------
  # Block 6 (lieux) — the place join surface (docs/us/block-studies/6-lieux.md).
  # City Facilities is the STRUCTURED-LOCATION BACKBONE the money tables lack:
  # every city facility with common_name + address + block_lot (APN) + geom.
  # It is the gazetteer that the place↔money crosswalks and the APN/spatial
  # joins all hang off. ~1,734 rows.
  # ---------------------------------------------------------------------------
  - id: sf_city_facilities
    type: socrata
    target_table: us_sf_city_facilities
    dataset_id: "nc68-ngbr"
    mode: paged-json
    order_by: ":id"
    description: "SF City Facilities registry — ~1,734 facilities (common_name, address, block_lot/APN, owned/leased, sq ft, dept, geom)"

  # Rec/Park facility features (park names + geometry), 6A gazetteer complement
  # for the park family that the City Facilities registry covers thinly.
  - id: sf_recpark_facilities
    type: socrata
    target_table: us_sf_recpark_facilities
    dataset_id: "ib5c-xgwu"
    mode: paged-json
    order_by: ":id"
    description: "SF Recreation & Park facilities — ~2,687 features (name, type, geometry) for the park-family gazetteer"

  # ---------------------------------------------------------------------------
  # Block 6B/6C/6D — place-level CAPITAL money. These are OVERLAPPING views of
  # the same physical work in different ledgers (bond expended ⊇ contract paid
  # ≈ permit declared value) — mart_us_sf_place_capital labels each measure and
  # NEVER sums across them (docs/us/block-studies/6-lieux.md §capital no-sum).
  #
  # GO Bond spending & status — actual $ EXPENDED per bond program item
  # ($4.37B expended all-time), the voter-approved capital ledger.
  - id: sf_go_bond_spending
    type: socrata
    target_table: us_sf_go_bond_spending
    dataset_id: "m793-kis4"
    mode: paged-json
    order_by: ":id"
    description: "SF GO Bond Program Spending & Status — 151 program items (bondauthamount/revisedbudget/expended, voter_approved_date)"

  # GO Bond projects — the granular named projects under each bond program
  # (planned_project_name, e.g. 'RP Buena Vista Park Master Pln'). No $ of its
  # own — pairs with sf_go_bond_spending (program-item level) for money.
  - id: sf_go_bond_projects
    type: socrata
    target_table: us_sf_go_bond_projects
    dataset_id: "d3dc-v5yr"
    mode: paged-json
    order_by: ":id"
    description: "SF GO Bond Projects — 305 named projects per bond (planned_project_name, component, completion)"

  # DPW internal & external projects — geolocated chantiers (co_ordinatepoint),
  # facility_type, project_status, client_contract_id (bridge to contract $).
  # Carries NO money of its own; dollars come via the contract it links.
  - id: sf_dpw_projects
    type: socrata
    target_table: us_sf_dpw_projects
    dataset_id: "btxj-k9uh"
    mode: paged-json
    order_by: ":id"
    description: "SF DPW Internal & External Projects — ~8,356 geolocated projects (name, facility_type, status, client_contract_id, point geom)"

  # Building Permits — construction VALUE by parcel (block+lot = APN), joins to
  # City Facilities block_lot at ~100% precision. estimated_cost/revised_cost is
  # the applicant's declared construction value (a permit measure, NOT city
  # spend). Large table — synced in full; downstream filtered to gazetteer APNs.
  - id: sf_building_permits
    type: socrata
    target_table: us_sf_building_permits
    dataset_id: "i98e-djp9"
    mode: paged-json
    order_by: ":id"
    description: "SF Building Permits — block+lot (APN), estimated_cost/revised_cost, description, status, issued_date, location"

  # ---------------------------------------------------------------------------
  # Local government finance — Census national base + four pilot states
  # (sync_us_local_finance.py). Sources verified 2026-09-18/22; see the memory
  # note project_us_municipal_finance_sources for coverage, freshness and the
  # measured cross-source reconciliation.
  # ---------------------------------------------------------------------------

  # Census of Governments / Annual Survey of Local Government Finances. Every
  # US local government in census years (2017, 2022), a size-stratified sample
  # (~25k units, every large city) in between. 247 item codes; E* = current
  # operations BY FUNCTION. Amounts in thousands. Published ~2 years late,
  # each March. 2022 is inflated by one-time federal ARPA money.
  - id: census_iuf
    type: census_iuf
    url_pattern: "https://www2.census.gov/programs-surveys/gov-finances/tables/{year}/{year}_Individual_Unit_File{s}.zip"
    years: {from: 2017, to: current}
    target_table: us_census_iuf_finance
    units_table: us_census_iuf_units
    source: "U.S. Census Bureau, Census of Governments / Annual Survey of State and Local Government Finances, Individual Unit File"

  # Iowa — budget AND actual per city per function, same 10 functions for both
  # (FY2007+ ; actuals lag ~2 fiscal years). Department of Management.
  # Certified budget LINE ITEMS (line × program × fund), FY2009 → the year
  # just started: carries FY2026 and FY2027 where 925 stops at FY2025. Its
  # program totals equal 925's budget for the same year (FY2025: $11.6B,
  # every program within $0.03B — checked 2026-09-22). Five csv parts.
  # City property tax rates, one workbook per fiscal year (FY2000 → the year
  # just certified) in the DOM's public Drive folder "City Property Tax Rate
  # Files" (linked from dom.iowa.gov/local-government/city-resources).
  - id: ia_city_tax_rates
    type: iowa_drive_rates
    folder_id: "1rDAQSViry0JyL-cuoSVIq9GVRUH-Ozs8"
    target_table: us_ia_dom_city_tax_rates
    source: "Iowa Department of Management, City Property Tax Rate Files"
  # Outstanding debt at June 30 of every public body, with population and
  # per capita (Iowa Treasurer's debt reporting site), FY2018 →.
  - id: ia_debt_obligations
    type: iowa_debt_html
    url_pattern: "https://www.debtreportingiowa.gov/index.cfm?fuseaction=c.outstandingObligations&fy={fy}"
    years: {from: 2018, to: current}
    target_table: us_ia_treasurer_debt
    source: "Iowa Treasurer of State, Debt Reporting, Outstanding Obligations"
  - id: ia_city_budget_line_items
    type: iowa_datahub
    dataset_id: 926
    target_table: us_ia_city_budget_line_items
    source: "Iowa Department of Management, City Budget Expenditures by Fund and Fiscal Year (data.iowa.gov dataset 926)"
  - id: ia_city_expenditures
    type: iowa_datahub
    dataset_id: 925
    target_table: us_ia_city_budget_actual_expenditures
    source: "Iowa Department of Management, City Budget and Actual Expenditures (data.iowa.gov dataset 925)"
  - id: ia_city_revenues
    type: iowa_datahub
    dataset_id: 928
    target_table: us_ia_city_budget_actual_revenues
    source: "Iowa Department of Management, City Budget and Actual Revenue (data.iowa.gov dataset 928)"

  # Indiana — voted budget line items (Form 1: fund × department × expenditure
  # category × item, published and approved amounts) and actual disbursements
  # (AFR, same department list and expenditure classes). Current year included.
  - id: in_budget_line_items
    type: indiana_gateway
    kind: "Budget Data"
    subkind: "Line-Item Budget Estimate (Form 1)"
    unit_types: ["City/Town"]
    years: {from: 2019, to: next}
    target_table: us_in_budget_line_items
    source: "Indiana Department of Local Government Finance, Gateway, Line-Item Budget Estimate (Form 1)"
  # Debt, one row per issue (bond, loan, note) with its end-of-year principal
  # balance, the fund that owes it and its class (GO, revenue, notes).
  # 2025: 2,503 issues in 443 cities/towns, $11.17B outstanding (checked
  # 2026-09-23). Indianapolis files under "Special" units: not here.
  - id: in_afr_debt
    type: indiana_gateway
    kind: "Annual Financial Reports"
    subkind: "Debt"
    unit_types: ["City/Town"]
    years: {from: 2016, to: current}
    target_table: us_in_afr_debt
    source: "Indiana State Board of Accounts, Gateway Annual Financial Report, Debt"
  # Certified budget, levy, net assessed value and tax RATE (per $100 of
  # assessed value) per unit × fund, every unit type; a city's or town's own
  # rate is the sum over its funds (unit type 3). 2023's file is "_v2".
  - id: in_certified_rates
    type: xlsx_by_year
    files:
      2022: "https://www.in.gov/dlgf/files/2022-reports/2022_Certifed_Budget_Levy_CNAV_Rate_by_Fund.xlsx"
      2023: "https://www.in.gov/dlgf/files/2023-reports/2023_Certifed_Budget_Levy_CNAV_Rate_by_Fund_v2.xlsx"
      2024: "https://www.in.gov/dlgf/files/2024-reports/2024_Certifed_Budget_Levy_CNAV_Rate_by_Fund.xlsx"
      2025: "https://www.in.gov/dlgf/files/2025-reports/2025_Certifed_Budget_Levy_CNAV_Rate_by_Fund.xlsx"
      2026: "https://www.in.gov/dlgf/files/2026-reports/2026_Certifed_Budget_Levy_CNAV_Rate_by_Fund.xlsx"
    target_table: us_in_dlgf_certified_rates
    source: "Indiana Department of Local Government Finance, Certified Budget, Levy, CNAV and Rate by Fund"
  - id: in_afr_disbursements
    type: indiana_gateway
    kind: "Annual Financial Reports"
    subkind: "Disbursements by Fund and Department"
    unit_types: ["City/Town"]
    years: {from: 2016, to: current}
    target_table: us_in_afr_disbursements
    source: "Indiana State Board of Accounts, Gateway Annual Financial Report, Disbursements by Fund and Department"

  # Massachusetts — Schedule A general fund by function (actuals, 351 towns,
  # 2002+) and the tax-rate-recap operating budget (voted TOTAL, current FY).
  # The recap files appropriations by funding source, not by function.
  - id: ma_general_fund_expenditures
    type: ma_dls_logi
    report: ScheduleA.GeneralFund
    table_id: xtGenFund
    params: {islAmountType: Expenditures}
    param_guid: "2b1e9c56551342598b9ed3ad026042b8"
    year_param: islYear
    years: {from: 2002, to: current}
    target_table: us_ma_dls_general_fund_expenditures
    source: "Massachusetts DOR Division of Local Services, Schedule A General Fund Expenditures"
  - id: ma_general_fund_revenues
    type: ma_dls_logi
    report: ScheduleA.GeneralFund
    table_id: xtGenFund
    params: {islAmountType: Revenues}
    param_guid: "2b1e9c56551342598b9ed3ad026042b8"
    year_param: islYear
    years: {from: 2002, to: current}
    target_table: us_ma_dls_general_fund_revenues
    source: "Massachusetts DOR Division of Local Services, Schedule A General Fund Revenues"
  - id: ma_operating_budget
    type: ma_dls_logi
    report: 351BudgetperCapita
    table_id: DataTable1
    target_table: us_ma_dls_operating_budget
    source: "Massachusetts DOR Division of Local Services, Tax Rate Recapitulation, Total Budget per Capita"

  # Tax rates by class ($ per $1,000 of assessed value: residential, open
  # space, commercial, industrial, personal property), FY2003 → the year
  # being certified; the year parameter binds without its GUID twin.
  - id: ma_tax_rates
    type: ma_dls_logi
    report: PropertyTaxInformation.taxratesbyclass.taxratesbyclass
    table_id: tbl_taxratesbyclass
    year_param: iclYear
    years: {from: 2003, to: next}
    target_table: us_ma_dls_tax_rates
    source: "Massachusetts DOR Division of Local Services, Tax Rates by Class"
  # Long-term debt: total outstanding (Schedule A Part 10), per capita, and
  # general-fund debt service (Part 2) against the total budget, FY2005 →.
  - id: ma_long_term_debt
    type: ma_dls_logi
    report: Dashboard.Cat_6_Reports.LongTermDebt351
    table_id: tblLongTermDebt
    year_param: iclYear
    years: {from: 2005, to: current}
    target_table: us_ma_dls_long_term_debt
    source: "Massachusetts DOR Division of Local Services, Long Term Debt (Schedule A Parts 2 and 10)"

  # Florida DOR Data Book, Municipal Report: taxable value, CITY MILLAGE
  # RATE ($ per $1,000 of taxable value) and taxes levied, one sheet per
  # county, the two latest years in each edition (2024 and 2025 here); rows
  # "Pct Change" are the file's own ratios, dropped in staging.
  - id: fl_municipal_millage
    type: xlsx_by_year
    all_sheets: true
    skip_sheets: ["Report Index"]
    files:
      2025: "https://floridarevenue.com/property/Documents/municipal_report.xlsx"
    target_table: us_fl_dor_municipal_millage
    source: "Florida Department of Revenue, Property Tax Data Book, Municipal Report"

  # Florida — actual expenditures/revenues per municipality by Uniform
  # Accounting System account code × fund type, one workbook per municipality,
  # one sheet per fiscal year (~5 recent years). No voted budget at state level.
  - id: fl_municipal_expenditures
    type: fl_edr_xlsx
    index_url: "https://edr.state.fl.us/Content/local-government/data/revenues-expenditures/munifiscal.cfm"
    file_suffix: expenditures
    target_table: us_fl_edr_municipal_expenditures
    source: "Florida Office of Economic and Demographic Research, from DFS Annual Financial Reports (municipal expenditures)"
  - id: fl_municipal_revenues
    type: fl_edr_xlsx
    index_url: "https://edr.state.fl.us/Content/local-government/data/revenues-expenditures/munifiscal.cfm"
    file_suffix: revenues
    target_table: us_fl_edr_municipal_revenues
    source: "Florida Office of Economic and Demographic Research, from DFS Annual Financial Reports (municipal revenues)"

  # California — the Cities Annual Report each city files with the State
  # Controller: long format, one row per city × fiscal year × form line ×
  # fund category (governmental functions, each enterprise fund, internal
  # service). FY2003-FY2024 (2024 = fiscal year 2023-24), ~114k rows a year
  # since 2017, estimated population per row. Actuals only — California
  # collects no voted budgets. No subtotal rows (checked, Fresno 2024).
  # Long-term debt per issue from the SCO "Cities Raw Data" workbook (the
  # By the Numbers file blob, FY2022-23 and FY2023-24): bonds and COPs
  # (sheet 31) and other long-term debt — loans, notes (sheet 32), with the
  # principal outstanding at the end of the fiscal year.
  - id: ca_city_lt_debt
    type: xlsx_by_year
    sheet_name: "31 CIX_LT_DEBT"
    files:
      2024: "https://bythenumbers.sco.ca.gov/api/views/wjvf-fpdc/files/f3eaabf9-50ed-4347-98ee-f01abfa7ae64?download=true"
    target_table: us_ca_sco_city_lt_debt
    source: "California State Controller, Cities Raw Data, Long-Term Debt (bonds and COPs)"
  - id: ca_city_other_lt_debt
    type: xlsx_by_year
    sheet_name: "32 CIX_OTHER_LT_DEBT"
    files:
      2024: "https://bythenumbers.sco.ca.gov/api/views/wjvf-fpdc/files/f3eaabf9-50ed-4347-98ee-f01abfa7ae64?download=true"
    target_table: us_ca_sco_city_other_lt_debt
    source: "California State Controller, Cities Raw Data, Other Long-Term Debt (loans and notes)"
  - id: ca_city_expenditures
    type: socrata
    block: ca_sco
    target_table: us_ca_sco_city_expenditures
    dataset_id: "ju3w-4gxp"
    mode: bulk-csv
    description: "California SCO Cities Annual Report — expenditures, FY2003-FY2024, ~1.4M rows"
  - id: ca_city_revenues
    type: socrata
    block: ca_sco
    target_table: us_ca_sco_city_revenues
    dataset_id: "rrtv-rsj9"
    mode: bulk-csv
    description: "California SCO Cities Annual Report — revenues"
